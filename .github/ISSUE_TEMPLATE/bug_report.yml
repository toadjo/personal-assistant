name: Bug report
description: Report something that is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! The more detail you provide, the faster we can reproduce and fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect to happen, and what actually happened?
      placeholder: "I clicked X, expected Y, but got Z."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug reliably.
      placeholder: |
        1. Open the app
        2. Go to ...
        3. Click ...
        4. See error
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is this?
      options:
        - Data loss or crash
        - Broken core workflow (capture, plan, review, backup)
        - Broken life-area panel or secondary feature
        - Cosmetic or annoyance
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Find this in Help > About or run `git rev-parse --short HEAD` if building from source.
      placeholder: "3.8.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Paste any relevant logs, error messages, or Data Control > Diagnostics output. Redact personal data before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and could not find a duplicate.
          required: true
        - label: I redacted personal data from any pasted logs or screenshots.
          required: true
