version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group Electron-related updates together
      electron:
        patterns:
          - "electron*"
          - "@electron/*"
        exclude-patterns:
          - "*electron-rebuild*"
      # Group build tooling together
      build-tools:
        patterns:
          - "vite*"
          - "vitest*"
          - "@vitejs/*"
          - "@vitest/*"
          - "rollup*"
          - "esbuild*"
      # Group React-related updates together
      react:
        patterns:
          - "react*"
          - "@types/react*"
          - "@vitejs/plugin-react"
      # Group testing updates together
      testing:
        patterns:
          - "@testing-library/*"
          - "@playwright/*"
          - "@axe-core/*"
    # Major bumps need deliberate upgrades (Electron ABI, Vitest/Vite API, etc.); keep Dependabot to patch/minor.
    ignore:
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
