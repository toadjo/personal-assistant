name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to package (e.g. 1.2.3), must match package.json unless you change it first"
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version (tag builds only)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $expected = "v$pkg"
          if ($tag -ne $expected) {
            Write-Error "Git tag '$tag' must equal package.json version as 'v$pkg' (expected '$expected')."
            exit 1
          }
          Write-Host "OK: tag $tag matches package.json version $pkg"

      - name: Validate workflow_dispatch version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $want = "${{ github.event.inputs.version }}".Trim()
          if ($want -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version must be semver x.y.z"
            exit 1
          }
          $pkg = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($want -ne $pkg) {
            Write-Error "package.json version is $pkg but workflow requested $want. Bump package.json first or pass matching version."
            exit 1
          }
          Write-Host "OK: dispatch version matches package.json ($pkg)"

      - name: Package Windows installer (no git bump in CI)
        run: npm run release:build -- -SkipVersionBump -AllowDirtyGit -ReplaceExisting

      - name: Resolve versioned artifact paths
        id: artifacts
        shell: pwsh
        run: |
          $v = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$v"
          $releaseDir = Join-Path "release" $tag
          $historyDir = Join-Path "installer-history" $tag
          if (-not (Test-Path -LiteralPath $releaseDir)) { throw "Missing $releaseDir — packaging may have failed." }
          if (-not (Test-Path -LiteralPath $historyDir)) { throw "Missing $historyDir — packaging may have failed." }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_tag=$tag"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.artifacts.outputs.release_tag }}
          path: installer-history/${{ steps.artifacts.outputs.release_tag }}/

  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Resolve versioned artifact paths
        id: artifacts
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          echo "release_tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$v" >> $GITHUB_OUTPUT

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ steps.artifacts.outputs.release_tag }}
          path: release/

  publish-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [package-windows, package-linux]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve release metadata
        id: artifacts
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          echo "release_tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$v" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ steps.artifacts.outputs.release_tag }}
          path: tmp/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ steps.artifacts.outputs.release_tag }}
          path: tmp/linux

      - name: Validate and stage mirrorable release assets
        run: |
          node scripts/release-assets.mjs \
            --windows-dir tmp/windows \
            --linux-dir tmp/linux \
            --out-dir release-assets

      - name: Publish GitHub Release (private repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: Personal Assistant ${{ steps.artifacts.outputs.release_tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Require public mirror token
        shell: bash
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if [ -z "$PUBLIC_RELEASE_TOKEN" ]; then
            echo "PUBLIC_RELEASE_TOKEN is required for public release asset mirroring."
            exit 1
          fi

      - name: Mirror assets to public repo
        shell: bash
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${{ steps.artifacts.outputs.release_tag }}"
          repo="toadjo/Personal-Assistant-R"
          GH_TOKEN="$PUBLIC_RELEASE_TOKEN"
          if GH_TOKEN="$GH_TOKEN" gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            GH_TOKEN="$GH_TOKEN" gh release upload "$tag" release-assets/* --repo "$repo" --clobber
          else
            GH_TOKEN="$GH_TOKEN" gh release create "$tag" release-assets/* \
              --repo "$repo" \
              --title "Personal Assistant $tag" \
              --notes "Release assets for Personal Assistant $tag"
          fi
